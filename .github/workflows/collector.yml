name: Collector

on:
  push:
    paths:
      - 'collector/**'
      - 'docs/free-node/**'
      - '.github/workflows/collector.yml'
  pull_request:
    paths:
      - 'collector/**'
      - 'docs/free-node/**'
      - '.github/workflows/collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run unit tests
        run: go test ./...
      - name: Run vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build image
        run: docker build --file deploy/Dockerfile --tag freev2ray-collector:ci .
